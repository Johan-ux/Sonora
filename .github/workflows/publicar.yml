name: Publicar

# Construye Sonora para Windows (ver scripts/construir.py) y, si lo lanza una
# etiqueta v…, crea la release con el zip, su huella y las notas del changelog.
# A mano (Run workflow) solo deja el zip como artefacto de la ejecución.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Construir y publicar
    runs-on: windows-latest
    permissions:
      contents: write # crear la release y subirle los ficheros
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Antes de gastar minutos en construir: una etiqueta que no coincide con
      # la versión, o sin su sección en el changelog, es un descuido.
      - name: Comprobar la versión y el changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import sonora; print(sonora.__version__)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión de sonora/__init__.py ($version)."
            exit 1
          fi
          # De su «## [versión]» hasta la siguiente sección o los enlaces del final.
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {dentro=1; next} dentro && (/^## \[/ || /^\[[^]]*\]: /) {exit} dentro' CHANGELOG.md > notas.md
          if ! grep -q '[^[:space:]]' notas.md; then
            echo "::error::CHANGELOG.md no tiene la sección [$version]."
            exit 1
          fi
          cat >> notas.md <<'EOF'

          ---

          **Para usarla:** descarga `Sonora-windows-x64.zip`, descomprímelo y abre `Sonora\Sonora.exe` (Windows 10 u 11 de 64 bits; no hace falta instalar nada). `Sonora-windows-x64.zip.sha256` es su huella SHA-256.
          EOF

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "pyinstaller>=6.16"

      - name: Tests
        run: python -m pytest

      - name: Construir
        run: python scripts/construir.py

      - uses: actions/upload-artifact@v7
        with:
          path: dist/Sonora-windows-x64.zip
          archive: false

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/Sonora-windows-x64.zip dist/Sonora-windows-x64.zip.sha256
          --title "Sonora $GITHUB_REF_NAME"
          --notes-file notas.md
