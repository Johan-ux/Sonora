name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo lectura: la CI no publica nada.
permissions:
  contents: read

# Un push nuevo a la misma rama deja sin sentido la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # La mínima que admiten yt-dlp y pythonnet, y la que lleva el .exe.
        python: ["3.11", "3.14"]
        # macOS, con una basta: sus minutos cuentan diez veces en un repo privado.
        include:
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compilar (comprobación de sintaxis)
        run: python -m compileall -q sonora scripts

      - name: Lint (ruff)
        run: python -m ruff check sonora tests scripts

      - name: Tests
        run: python -m pytest

  arranque:
    name: Arranque con iniciar.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sin motor de ventana para pywebview: Sonora tiene que darse cuenta
          # sola y pasar al navegador.
          - os: ubuntu-latest
            argumentos: ""
            sin_ventana: true
          # La ventana usaría el WebKit del sistema; aquí se prueba el navegador.
          - os: macos-latest
            argumentos: "--navegador"
            sin_ventana: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Desde cero, como lo haría alguien: el script crea el entorno, instala y
      # arranca. BROWSER=true hace de navegador que no abre nada.
      - name: Arrancar Sonora con scripts/iniciar.sh
        env:
          BROWSER: "true"
        run: |
          scripts/iniciar.sh ${{ matrix.argumentos }} > sonora.log 2>&1 &
          sonora=$!
          url=""
          for _ in $(seq 1 300); do
            url=$(grep -o 'en el navegador: http://127.0.0.1:[0-9]*' sonora.log | grep -o 'http.*' || true)
            [ -n "$url" ] && break
            sleep 1
          done
          cat sonora.log
          test -n "$url"
          if [ "${{ matrix.sin_ventana }}" = "true" ]; then
            grep -q "No se pudo abrir la ventana de Sonora" sonora.log
          fi
          curl -fsS "$url/" | grep -q "<title>Sonora</title>"
          curl -fsS "$url/api/salud?red=0"
          kill "$sonora"
