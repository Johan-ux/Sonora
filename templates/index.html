<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Descargador de Música</title>
    <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body>
    <div class="contenedor">
        <header>
            <h1>🎵 Descargador de Música</h1>
            <p class="subtitulo">Pega tus URLs de YouTube y descarga en MP3 a 320 kbps</p>
        </header>

        <!-- Formulario -->
        <section class="tarjeta">
            <label for="urls">URLs <span class="hint">(una por línea o separadas por comas)</span></label>
            <textarea id="urls" rows="6" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/..."></textarea>

            <div class="fila-opciones">
                <div class="campo">
                    <label for="bitrate">Bitrate</label>
                    <select id="bitrate">
                        <option value="128">128 kbps</option>
                        <option value="192">192 kbps</option>
                        <option value="256">256 kbps</option>
                        <option value="320" selected>320 kbps</option>
                    </select>
                </div>
                <button id="btn-descargar" onclick="iniciarDescarga()">
                    <span class="icono">⬇</span> Descargar
                </button>
            </div>
        </section>

        <!-- Progreso -->
        <section id="sec-progreso" class="tarjeta oculto">
            <h2>Progreso</h2>
            <div id="lista-progreso"></div>
            <div id="resumen" class="oculto"></div>
        </section>

        <!-- Archivos descargados -->
        <section class="tarjeta">
            <h2>Mis Descargas</h2>
            <div id="lista-archivos">
                <p class="vacio">Cargando…</p>
            </div>
        </section>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
