<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Descargador de Música</title>
    <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body>
    <!-- Layout principal 70/30 -->
    <div class="layout-principal">

        <!-- Panel izquierdo: YouTube (70%) -->
        <div class="panel-youtube">
            <div class="barra-navegacion tarjeta-flotante">
                <button class="btn-nav" id="btn-atras" onclick="navegarAtras()" title="Atrás">◀</button>
                <button class="btn-nav" id="btn-adelante" onclick="navegarAdelante()" title="Adelante">▶</button>
                <button class="btn-nav" id="btn-home" onclick="navegarHome()" title="Inicio">🏠</button>
                <input type="text" id="barra-url" class="input-url" value="https://www.youtube.com" 
                       placeholder="URL de YouTube..." onkeydown="if(event.key==='Enter') navegarA(this.value)">
                <button class="btn-nav btn-ir" onclick="navegarA(document.getElementById('barra-url').value)">Ir</button>
            </div>
            <iframe id="youtube-frame" 
                    src="https://www.youtube.com" 
                    class="frame-youtube"
                    sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-presentation"
                    allow="autoplay; encrypted-media"
                    referrerpolicy="no-referrer">
            </iframe>
        </div>

        <!-- Panel derecho: Control (30%) -->
        <div class="panel-control">

            <!-- Info del video actual -->
            <div class="tarjeta-flotante" id="seccion-info">
                <div class="tarjeta-header">
                    <h3>🎵 Video Detectado</h3>
                </div>
                <div id="info-video" class="info-video">
                    <p class="texto-muted">Navega en YouTube y pega una URL aquí para ver su información.</p>
                </div>
                <div class="input-url-manual">
                    <input type="text" id="input-url-video" placeholder="Pega una URL de YouTube..." 
                           onkeydown="if(event.key==='Enter') detectarUrl()">
                    <button class="btn-accion btn-detectar" onclick="detectarUrl()">🔍</button>
                </div>
            </div>

            <!-- Carpeta destino -->
            <div class="tarjeta-flotante" id="seccion-carpeta-destino">
                <div class="tarjeta-header">
                    <h3>📂 Destino</h3>
                    <button class="btn-icono" onclick="toggleExploradorCarpetas()" title="Explorar carpetas">📁</button>
                </div>
                <div class="carpeta-actual">
                    <span id="ruta-destino" class="ruta-texto">descargas/</span>
                </div>
            </div>

            <!-- Cola de descarga -->
            <div class="tarjeta-flotante" id="seccion-cola">
                <div class="tarjeta-header">
                    <h3>📋 Cola de Descarga</h3>
                    <span class="badge" id="badge-cola">0</span>
                </div>
                <div id="lista-cola" class="lista-cola">
                    <p class="texto-muted texto-centro">La cola está vacía</p>
                </div>
                <button class="btn-accion btn-descargar-cola" id="btn-descargar-cola" 
                        onclick="iniciarDescargaCola()" disabled>
                    ⬇ Descargar Cola
                </button>
            </div>

            <!-- Progreso -->
            <div class="tarjeta-flotante" id="seccion-progreso">
                <div class="tarjeta-header">
                    <h3>📊 Progreso</h3>
                    <div class="tabs-progreso">
                        <button class="tab activo" onclick="cambiarTabProgreso('activo')">Activo</button>
                        <button class="tab" onclick="cambiarTabProgreso('completado')">Completado</button>
                    </div>
                </div>
                <div id="lista-progreso-activo" class="lista-progreso">
                    <p class="texto-muted texto-centro">Sin descargas activas</p>
                </div>
                <div id="lista-progreso-completado" class="lista-progreso oculto">
                    <p class="texto-muted texto-centro">Sin descargas completadas</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Panel de explorador de carpetas (tercera vista, overlay) -->
    <div class="overlay-carpetas oculto" id="overlay-carpetas">
        <div class="panel-carpetas tarjeta-flotante">
            <div class="tarjeta-header">
                <h3>📁 Explorador de Carpetas</h3>
                <button class="btn-icono btn-cerrar" onclick="toggleExploradorCarpetas()">✕</button>
            </div>
            <div class="carpetas-navegacion">
                <button class="btn-nav-carpeta" id="btn-subir-carpeta" onclick="subirCarpeta()" disabled>⬆ Subir</button>
                <span class="ruta-texto" id="ruta-explorador">descargas/</span>
                <button class="btn-nav-carpeta btn-nueva" onclick="mostrarCrearCarpeta()">+ Nueva Carpeta</button>
            </div>
            <div id="form-nueva-carpeta" class="form-nueva-carpeta oculto">
                <input type="text" id="input-nueva-carpeta" placeholder="Nombre de la carpeta..."
                       onkeydown="if(event.key==='Enter') crearCarpeta()">
                <button class="btn-accion btn-crear" onclick="crearCarpeta()">Crear</button>
                <button class="btn-accion btn-cancelar" onclick="cancelarCrearCarpeta()">✕</button>
            </div>
            <div id="lista-carpetas" class="lista-carpetas">
                <p class="texto-muted texto-centro">Cargando...</p>
            </div>
            <div class="carpetas-acciones">
                <button class="btn-accion btn-seleccionar" onclick="seleccionarCarpetaActual()">
                    ✓ Seleccionar esta carpeta como destino
                </button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
